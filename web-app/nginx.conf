server {
    listen 8080;
    server_name _;
    root /usr/share/nginx/html;
    index index.html;
    charset utf-8;
    server_tokens off;

    # Read-only static site: only GET/HEAD, tiny request limits
    if ($request_method !~ ^(GET|HEAD)$) { return 405; }

    # Behind Cloudflare: plain-HTTP visitors are redirected to HTTPS (LAN access has no such header)
    if ($http_x_forwarded_proto = "http") { return 301 https://$host$request_uri; }
    client_max_body_size 1k;
    client_body_buffer_size 1k;
    large_client_header_buffers 4 8k;

    gzip on;
    gzip_vary on;
    gzip_types application/json application/javascript text/javascript text/css application/manifest+json;
    gzip_min_length 1024;

    # Files have no content hash in their names -> always revalidate (ETag); offline is handled by the service worker
    location / {
        include /etc/nginx/security-headers.conf;
        add_header Cache-Control "no-cache" always;
        try_files $uri $uri/ =404;
    }

    location = /sw.js {
        include /etc/nginx/security-headers.conf;
        add_header Cache-Control "no-cache, no-store, must-revalidate" always;
    }

    location ~ \.webmanifest$ {
        include /etc/nginx/security-headers.conf;
        add_header Cache-Control "no-cache" always;
        default_type application/manifest+json;
    }

    location = /robots.txt {
        include /etc/nginx/security-headers.conf;
        default_type text/plain;
        return 200 "User-agent: *\nDisallow: /\n";
    }

    # Never serve dotfiles
    location ~ /\. {
        return 404;
    }
}
